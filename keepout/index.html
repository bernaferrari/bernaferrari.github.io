<!DOCTYPE html>
<html lang="en" style="background:#1a1110;color-scheme:dark">
<head>
    <meta charset="UTF-8">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a1110;
        }
        #loading {
            color: #f0deda;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            width: 100%;
            height: 100%;
            background: #1a1110;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(240, 222, 218, 0.15);
            border-top-color: #ffb4a3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .label {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            opacity: 0.9;
        }
    </style>
