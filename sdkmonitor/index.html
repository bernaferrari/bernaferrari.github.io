<!DOCTYPE html>
<html lang="en" style="background:#121212;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#121212">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
        }
        #loading {
            color: #e8e8e8;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            width: 100%;
            height: 100%;
            background: #121212;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(232, 232, 232, 0.15);
            border-top-color: #90caf9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .label {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            opacity: 0.9;
        }
        canvas { display: block; }
    </style>
    <title>SDK Monitor | Browser demo</title>
    <link rel="canonical" href="https://bernaferrari.github.io/sdkmonitor/">
    <link rel="icon" href="../showcase/sdkmonitor/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../showcase/sdkmonitor/apple-touch-icon.png" sizes="180x180">
    <meta name="description" content="Browse sample Android apps by target SDK and see version changes in the update log.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SDK Monitor | Browser demo">
    <meta name="twitter:description" content="Browse sample Android apps by target SDK and see version changes in the update log.">
    <meta name="twitter:image" content="https://bernaferrari.github.io/showcase/sdkmonitor/social.jpg">
    <meta name="twitter:image:alt" content="SDK Monitor analytics, app list, and version details">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bernardo Ferrari’s app demos">
    <meta property="og:title" content="SDK Monitor | Browser demo">
    <meta property="og:description" content="Browse sample Android apps by target SDK and see version changes in the update log.">
    <meta property="og:url" content="https://bernaferrari.github.io/sdkmonitor/">
    <meta property="og:image" content="https://bernaferrari.github.io/showcase/sdkmonitor/social.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SDK Monitor analytics, app list, and version details">
</head>
<body>
<noscript>Enable JavaScript to run this demo.</noscript>
<div id="loading" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <p class="label">Loading SDK Monitor…</p>
</div>
<script src="../showcase/isolate.js" data-app="sdkmonitor-demo.js"></script>
</body>
</html>
